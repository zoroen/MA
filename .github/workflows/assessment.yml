name: Morning Assessment

# ──────────────────────────────────────────────────────────────────
# GitHub Actions cron can be delayed 30-90 minutes during peak hours.
# STRATEGY: Schedule ~30 min early + scripts wait until exact IST time.
#
# Targets (IST):
#   login.py     → 5:30 AM IST
#   Submitter.py → 6:15 AM IST
#
# Crons (30 min early, UTC):
#   login.py     → 5:00 AM IST = 23:30 UTC (prev day) → Sun-Fri
#   Submitter.py → 5:45 AM IST = 00:15 UTC           → Mon-Sat
#
# Runs Monday–Saturday (IST)
# ──────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '30 23 * * 0-5'   # 5:00 AM IST (Mon-Sat) → login.py waits until 5:30
    - cron: '15 0 * * 1-6'    # 5:45 AM IST (Mon-Sat) → Submitter.py waits until 6:15
  workflow_dispatch:
    inputs:
      script:
        description: 'Which script to run'
        required: true
        default: 'Submitter.py'
        type: choice
        options:
          - login.py
          - Submitter.py

env:
  PYTHONUNBUFFERED: '1'
  # Scripts read these to know when to start
  LOGIN_TARGET_HOUR: '5'
  LOGIN_TARGET_MINUTE: '30'
  SUBMITTER_TARGET_HOUR: '6'
  SUBMITTER_TARGET_MINUTE: '15'

jobs:
  # ═══════════════════════════════════════════════════════
  # Job 1: login.py — opens assessment (5:30 IST)
  # ═══════════════════════════════════════════════════════
  run-login:
    if: >-
      github.event.schedule == '30 23 * * 0-5' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.script == 'login.py')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome + xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          seleniumbase install chromedriver latest

      - name: Run login.py
        run: xvfb-run --auto-servernum python login.py

  # ═══════════════════════════════════════════════════════
  # Job 2: Submitter.py — answers + submits (6:15 IST)
  # ═══════════════════════════════════════════════════════
  run-submitter:
    if: >-
      github.event.schedule == '15 0 * * 1-6' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.script == 'Submitter.py')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome + xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          seleniumbase install chromedriver latest

      - name: Run Submitter.py
        run: xvfb-run --auto-servernum python Submitter.py
