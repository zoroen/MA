name: Morning Assessment

# ──────────────────────────────────────────────────────────────────────────
# BULLETPROOF DELAY-PROOF STRATEGY
#
# GitHub Actions cron can be delayed by up to 60-90 minutes during peak hours.
# To guarantee 100% punctual execution:
#   1. Single job starts 90 minutes early (4:00 AM IST / 22:30 UTC).
#   2. Even with a 90-minute GitHub delay, the job starts by 5:30 AM IST at latest.
#   3. Job holds until 5:30 AM IST -> executes login.py (starts exam, logs In-Time).
#   4. Job holds until 6:15 AM IST -> executes Submitter.py (answers & submits).
# ──────────────────────────────────────────────────────────────────────────
on:
  schedule:
    # 4:00 AM IST (Sun-Fri 22:30 UTC) = Mon-Sat in IST
    - cron: '30 22 * * 0-5'
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: '1'
  LOGIN_TARGET_HOUR: '5'
  LOGIN_TARGET_MINUTE: '30'
  SUBMITTER_TARGET_HOUR: '6'
  SUBMITTER_TARGET_MINUTE: '15'

jobs:
  run-assessment:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hour window to accommodate early start + waiting
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome + xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          seleniumbase install chromedriver latest

      - name: Step 1 - Start Exam at 5:30 AM IST (login.py)
        run: xvfb-run --auto-servernum python login.py

      - name: Step 2 - Submit Exam at 6:15 AM IST (Submitter.py)
        run: xvfb-run --auto-servernum python Submitter.py
